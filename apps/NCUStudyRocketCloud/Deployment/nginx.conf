# Managed StudyRocket virtual host. Does not replace SoulCourse configuration.
server {
    listen 80;
    server_name studyrocket.soulcourse.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/studyrocket-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name studyrocket.soulcourse.cn;
    ssl_certificate /etc/letsencrypt/live/studyrocket-soulcourse-cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyrocket-soulcourse-cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/studyrocket-access.log;
    error_log /var/log/nginx/studyrocket-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # CUTOVER GATE: remove the following line only after all acceptance gates pass.
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        proxy_pass http://127.0.0.1:43818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
}
